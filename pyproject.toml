[project]
package-mode = false
name = "bank-project"
version = "0.1.0"
description = ""
authors = [
    {name = "nikitos"}
]
requires-python = ">=3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
backend-path = ["src"]
[tool.black]
line-length = 88
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.pytest.ini_options]
pythonpath = "src"
addopts = ["--import-mode=importlib"]